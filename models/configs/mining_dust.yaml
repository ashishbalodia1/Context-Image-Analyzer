# YOLOv8 Training Config: mining_dust
path: data/datasets/mining_dust
train: images/train
val: images/val
test: images/test

nc: 4
names:
  - dust_cloud
  - uncovered_transport
  - haul_road_dust
  - stockpile_dust

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
