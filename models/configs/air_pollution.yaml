# YOLOv8 Training Config: air_pollution
path: data/datasets/air_pollution
train: images/train
val: images/val
test: images/test

nc: 5
names:
  - industrial_smoke
  - open_burning
  - construction_dust
  - road_dust
  - vehicle_exhaust

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
